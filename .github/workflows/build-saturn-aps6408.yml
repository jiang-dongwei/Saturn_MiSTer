name: Build Saturn APS6408 octal DDR
on:
  push:
    branches: [codex/qpi-33m87-validation]
    paths:
      - .github/workflows/build-saturn-aps6408.yml
      - Saturn.sv
      - Saturn_APS6408.*
      - files_aps6408_runtime.qip
      - rtl/ramh_aps6408_adapter.sv
      - rtl/aps6408_diag_core.sv
      - sim/psram/tb_ramh_aps6408.sv
      - sim/psram/tb_aps6408_training.sv
      - sim/psram/report_saturn_aps6408_timing.tcl
      - rtl/aps6408_runtime_pll/**
  workflow_dispatch:
    inputs:
      build_quartus:
        description: Build complete Saturn after regression
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: saturn-aps6408-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    uses: ./.github/workflows/build-aps6408-diag.yml
    with:
      simulation_only: true
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install HDL checker
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Check self-written SH-2 diagnostic programs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          python3 sim/psram/check_saturn_testrom.py | tee .ci/testrom-semantics.log
      - name: Verify complete RAMH protocol and CDC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          git show 7183387:rtl/aps6408_diag_rx.sv | sed 's/^module aps6408_diag_rx (/module aps6408_diag_rx_reference (/' > .ci/rx-reference.sv
          grep -q '^module aps6408_diag_rx_reference (' .ci/rx-reference.sv
          git show 9c2b5a32b3b33958f38162b1fc4e3998662e581a:rtl/aps6408_diag_core.sv \
            | sed 's/^module aps6408_diag_core #(/module aps6408_diag_core_counter_reference #(/' \
            > .ci/counter-reference.sv
          grep -q '^module aps6408_diag_core_counter_reference #(' .ci/counter-reference.sv
          iverilog -g2012 -DAPS6408_DIAG_SIM -DAPS_COUNTER_EQUIV -DAPS_RX_EQUIV -s tb_ramh_aps6408 -o .ci/ramh-aps.vvp \
            rtl/aps6408_diag_core.sv rtl/aps6408_diag_rx.sv rtl/aps6408_diag_ddio_input.sv \
            rtl/ramh_aps6408_adapter.sv .ci/counter-reference.sv .ci/rx-reference.sv sim/psram/tb_ramh_aps6408.sv
          for args in '' '+src_fast' '+src_slow' '+refresh' '+src_fast +refresh' '+src_slow +refresh' '+drop_config' '+dq_delay=7.0' '+speed8' '+speed16' '+speed8 +refresh' '+speed16 +refresh' '+speed50' '+speed50 +src_fast' '+speed50 +refresh' '+speed50 +dq_delay=7.0'; do
            printf 'SCENARIO legacy: %s\n' "$args" | tee -a .ci/ramh-aps-regression.log
            vvp .ci/ramh-aps.vvp $args | tee -a .ci/ramh-aps-regression.log
          done
          iverilog -g2012 -DAPS6408_DIAG_SIM -DAPS_RX_EQUIV -s tb_ramh_aps6408 -o .ci/ramh-memory-training.vvp \
            rtl/aps6408_diag_core.sv rtl/aps6408_diag_rx.sv rtl/aps6408_diag_ddio_input.sv \
            rtl/ramh_aps6408_adapter.sv .ci/rx-reference.sv sim/psram/tb_ramh_aps6408.sv
          for args in '' '+src_fast' '+src_slow' '+refresh' '+src_fast +refresh' '+src_slow +refresh' '+drop_config' '+dq_delay=7.0' '+speed8' '+speed16' '+speed8 +refresh' '+speed16 +refresh' '+speed50' '+speed50 +src_fast' '+speed50 +refresh' '+speed50 +dq_delay=7.0' '+bad_training' '+drop_training_dqs' '+shift_training_word' '+speed8 +shift_training_word' '+speed16 +shift_training_word' '+speed50 +shift_training_word' '+held_mode' '+speed50 +fast_phase=0.1' '+speed50 +fast_phase=3.0 +refresh' '+speed50 +fast_phase=6.5 +dq_delay=7.0'; do
            printf 'SCENARIO memory training: %s\n' "$args" | tee -a .ci/ramh-aps-regression.log
            vvp .ci/ramh-memory-training.vvp $args | tee -a .ci/ramh-aps-regression.log
          done
          iverilog -g2012 -DAPS6408_DIAG_SIM -s tb_aps6408_training -o .ci/training.vvp \
            rtl/aps6408_diag_core.sv rtl/aps6408_diag_rx.sv rtl/aps6408_diag_ddio_input.sv \
            sim/psram/tb_aps6408_training.sv
          vvp .ci/training.vvp | tee -a .ci/ramh-aps-regression.log
      - name: Verify isolated DQ7 selectors and reset-held controls
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -DAPS6408_DIAG_SIM -s tb_aps6408_dq7_taps -o .ci/dq7-taps.vvp \
            rtl/aps6408_diag_core.sv rtl/aps6408_diag_rx.sv rtl/aps6408_diag_ddio_input.sv \
            rtl/ramh_aps6408_adapter.sv sim/psram/tb_aps6408_dq7_taps.sv
          vvp .ci/dq7-taps.vvp | tee .ci/dq7-selectors.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Saturn_APS6408_Runtime_Regression
          path: |
            .ci/ramh-aps-regression.log
            .ci/testrom-semantics.log
            .ci/dq7-selectors.log
          include-hidden-files: true
  quartus:
    needs: [diagnostic, runtime]
    if: github.event_name == 'push' || inputs.build_quartus
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
      - name: Pull fixed Quartus
        run: docker pull theypsilon/quartus-lite-c5:17.0.2
      - name: Compile complete Saturn revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            bash -lc 'set -euo pipefail; cores=$(nproc); sed -i -E "s/(NUM_PARALLEL_PROCESSORS) [0-9]+/\1 ${cores}/" Saturn_APS6408.qsf; quartus_sh --flow compile Saturn_APS6408 2>&1 | tee .ci/saturn-aps-build.log; quartus_sta -t sim/psram/report_saturn_aps6408_timing.tcl 2>&1 | tee .ci/saturn-aps-paths.log'
      - name: Record RBF identity
        run: |
          test -s output_files_aps6408/Saturn_APS6408.rbf
          sha256sum output_files_aps6408/Saturn_APS6408.rbf | tee .ci/saturn-aps-rbf.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Saturn_APS6408_Build_Evidence
          include-hidden-files: true
          retention-days: 30
          path: |
            .ci/*.log
            .ci/*.rpt
            .ci/*.sha256
            output_files_aps6408/*.rbf
            output_files_aps6408/*.rpt
