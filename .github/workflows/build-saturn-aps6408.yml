name: RAMH statistics ROM checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check diagnostic program semantics
        run: |
          set -euo pipefail
          mkdir -p .ci
          python3 sim/psram/check_saturn_ramh_statistics.py | tee .ci/statistics-semantics.log
          python3 sim/psram/check_saturn_testrom.py | tee .ci/original-rom-semantics.log
      - name: Generate separately identified statistics programs
        run: |
          set -euo pipefail
          mkdir -p .ci/roms
          for seed in 0xA55A8041 0x5AA57FBE 0xFFFFFFFF 0; do
            python3 scripts/generate_saturn_ramh_statistics.py ".ci/roms/stats-$seed.bin" --seed "$seed"
          done
          python3 scripts/generate_saturn_ramh_statistics.py .ci/roms/stats-cached.bin --seed 0 --scan cached
          python3 scripts/generate_saturn_ramh_statistics.py .ci/roms/stats-readonly.bin --operation read
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAMH_Statistics_Evidence
          include-hidden-files: true
          path: .ci/
