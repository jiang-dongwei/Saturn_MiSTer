name: Build Saturn PSRAM 33M87 Slow1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-psram-33m87-slow1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quartus:
    name: GitHub-only Quartus 17.0.2 build
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GitHub-side HDL checker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run stable adapter regression on GitHub
        shell: bash
        run: sh sim/psram/run_ramh_adapter.sh

      - name: Elaborate asynchronous QPI bridge on GitHub
        shell: bash
        run: |
          mkdir -p .ci
          iverilog -g2012 -Wall -s psram_qpi_engine_cdc \
            -o .ci/psram_qpi_engine_cdc.vvp \
            rtl/psram_qpi_engine.sv \
            rtl/psram_qpi_engine_cdc.sv

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h

      - name: Pull fixed Quartus 17.0.2 image
        shell: bash
        run: docker pull theypsilon/quartus-lite-c5:17.0.2

      - name: Compile independent 33.8688 MHz RAMH_SLOW=1 revision
        shell: bash
        run: |
          mkdir -p .ci
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            bash -lc 'set -euo pipefail; quartus_sh --flow compile Saturn_PSRAM_33M87 2>&1 | tee .ci/Saturn_PSRAM_33M87-build.log'

      - name: Verify RBF and timing constraints
        shell: bash
        run: |
          set -euo pipefail
          test -s output_files_psram_33m87/Saturn_PSRAM_33M87.rbf
          grep -q 'PSRAM_33M87_CLK_EXT' output_files_psram_33m87/Saturn_PSRAM_33M87.sta.rpt
          if grep -E 'Ignored (filter|create_generated_clock).*Saturn_PSRAM_33M87\.sdc' \
              output_files_psram_33m87/Saturn_PSRAM_33M87.sta.rpt; then
            echo 'A Saturn_PSRAM_33M87.sdc constraint was ignored' >&2
            exit 1
          fi
          if grep -E 'PSRAM_(CLK|CE_N|DQ).*No input delay|PSRAM_(CLK|CE_N|DQ).*No output delay' \
              output_files_psram_33m87/Saturn_PSRAM_33M87.sta.rpt; then
            echo 'PSRAM port is missing an I/O timing constraint' >&2
            exit 1
          fi

          cp output_files_psram_33m87/Saturn_PSRAM_33M87.rbf \
            .ci/Saturn_PSRAM_33M87_RAMH_SLOW1_20260824.rbf
          sha256sum .ci/Saturn_PSRAM_33M87_RAMH_SLOW1_20260824.rbf | \
            tee .ci/Saturn_PSRAM_33M87-rbf.sha256

          {
            echo '## Saturn PSRAM 33.8688 MHz RAMH_SLOW=1 result'
            echo
            echo '```text'
            grep -hE 'Quartus Prime Full Compilation|Total logic elements|Total registers|Total block memory bits|Total pins|Slack|Timing requirements|PSRAM_33M87_CLK_EXT' \
              output_files_psram_33m87/Saturn_PSRAM_33M87.flow.rpt \
              output_files_psram_33m87/Saturn_PSRAM_33M87.fit.rpt \
              output_files_psram_33m87/Saturn_PSRAM_33M87.sta.rpt 2>/dev/null | tail -n 160 || true
            echo
            cat .ci/Saturn_PSRAM_33M87-rbf.sha256
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload RBF, build log, Fitter and TimeQuest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn_PSRAM_33M87_RAMH_SLOW1-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            .ci/Saturn_PSRAM_33M87-build.log
            .ci/Saturn_PSRAM_33M87-rbf.sha256
            .ci/Saturn_PSRAM_33M87_RAMH_SLOW1_20260824.rbf
            output_files_psram_33m87/Saturn_PSRAM_33M87.rbf
            output_files_psram_33m87/Saturn_PSRAM_33M87.flow.rpt
            output_files_psram_33m87/Saturn_PSRAM_33M87.map.rpt
            output_files_psram_33m87/Saturn_PSRAM_33M87.fit.rpt
            output_files_psram_33m87/Saturn_PSRAM_33M87.sta.rpt
            output_files_psram_33m87/Saturn_PSRAM_33M87.asm.rpt
