name: Build Saturn PSRAM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-psram-fast-ramh0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quartus:
    name: Quartus 17 full compilation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h

      - name: Pull Quartus 17 image
        shell: bash
        run: docker pull theypsilon/quartus-lite-c5:17.0.2

      - name: Run RAMH PSRAM adapter regression
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          bash sim/psram/run_ramh_adapter.sh

      - name: Compile Saturn PSRAM Fast RAMH0 revision
        shell: bash
        run: |
          mkdir -p .ci
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            bash -lc 'set -euo pipefail; quartus_sh --flow compile Saturn_PSRAM_Stress_Fast50 2>&1 | tee .ci/Fast50-build.log'

      - name: Verify RBF and summarize reports
        shell: bash
        run: |
          test -s output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.rbf
          grep -q 'PSRAM_FAST50_CLK_EXT' output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.sta.rpt
          if grep -E 'PSRAM_(CE_N|DQ\[[0-3]\]).*No (input|output) delay' output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.sta.rpt; then
            echo 'PSRAM data/control timing constraint is missing' >&2
            exit 1
          fi
          sha256sum output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.rbf | tee .ci/Fast50-rbf.sha256
          {
            echo '## PSRAM 50.80 MHz diagnostic Quartus result'
            echo
            echo '```text'
            grep -hE 'Quartus Prime Full Compilation|Total logic elements|Total registers|Total block memory bits|Total pins|Slack|Timing requirements' \
              output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.flow.rpt \
              output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.fit.rpt \
              output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.sta.rpt 2>/dev/null | tail -n 120 || true
            echo
            grep -E 'PSRAM_RUNTIME_CLK_EXT|Worst-case setup slack|Worst-case hold slack' \
              output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.sta.rpt 2>/dev/null | tail -n 80 || true
            echo
            cat .ci/Fast50-rbf.sha256
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload RBF and Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn_PSRAM_Fast50_Diagnostic-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            .ci/Fast50-build.log
            .ci/Fast50-rbf.sha256
            Saturn_PSRAM_Stress_Fast50.sdc
            output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.rbf
            output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.flow.rpt
            output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.map.rpt
            output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.fit.rpt
            output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.sta.rpt
            output_files_stress_fast50/Saturn_PSRAM_Stress_Fast50.asm.rpt
