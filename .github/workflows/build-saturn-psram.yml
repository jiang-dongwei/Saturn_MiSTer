name: Build Saturn PSRAM Full Throughput

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-psram-full-throughput-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quartus:
    name: Quartus 17 full compilation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h

      - name: Pull Quartus 17 image
        shell: bash
        run: docker pull theypsilon/quartus-lite-c5:17.0.2

      - name: Compile full Saturn PSRAM throughput revision
        shell: bash
        run: |
          mkdir -p .ci
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            bash -lc 'set -euo pipefail; quartus_sh --flow compile Saturn_PSRAM 2>&1 | tee .ci/Saturn_PSRAM-build.log'

      - name: Verify RBF and summarize reports
        shell: bash
        run: |
          test -s output_files_psram/Saturn_PSRAM.rbf
          sha256sum output_files_psram/Saturn_PSRAM.rbf | tee .ci/Saturn_PSRAM-rbf.sha256
          {
            echo '## Saturn PSRAM full throughput Quartus result'
            echo
            echo '```text'
            grep -hE 'Quartus Prime Full Compilation|Total logic elements|Total registers|Total block memory bits|Total pins|Slack|Timing requirements' \
              output_files_psram/Saturn_PSRAM.flow.rpt \
              output_files_psram/Saturn_PSRAM.fit.rpt \
              output_files_psram/Saturn_PSRAM.sta.rpt 2>/dev/null | tail -n 120 || true
            echo
            cat .ci/Saturn_PSRAM-rbf.sha256
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload RBF and Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn_PSRAM_Full_Throughput-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            .ci/Saturn_PSRAM-build.log
            .ci/Saturn_PSRAM-rbf.sha256
            output_files_psram/Saturn_PSRAM.rbf
            output_files_psram/Saturn_PSRAM.flow.rpt
            output_files_psram/Saturn_PSRAM.map.rpt
            output_files_psram/Saturn_PSRAM.fit.rpt
            output_files_psram/Saturn_PSRAM.sta.rpt
            output_files_psram/Saturn_PSRAM.asm.rpt
