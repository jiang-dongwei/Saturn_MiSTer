name: Build Saturn PSRAM Stress ReadFix Pair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-psram-stress-readfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quartus:
    name: Quartus 17 full compilation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h

      - name: Pull Quartus 17 image
        shell: bash
        run: docker pull theypsilon/quartus-lite-c5:17.0.2

      - name: Compile LateSample and LongGap in one container
        shell: bash
        run: |
          mkdir -p .ci
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            bash -lc 'set -euo pipefail; quartus_sh --flow compile Saturn_PSRAM_Stress_LateSample 2>&1 | tee .ci/Saturn_PSRAM_Stress_LateSample-build.log; quartus_sh --flow compile Saturn_PSRAM_Stress_LongGap 2>&1 | tee .ci/Saturn_PSRAM_Stress_LongGap-build.log'

      - name: Verify RBF and summarize reports
        shell: bash
        run: |
          test -s output_files_stress_late/Saturn_PSRAM_Stress_LateSample.rbf
          test -s output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.rbf
          sha256sum output_files_stress_late/Saturn_PSRAM_Stress_LateSample.rbf | tee .ci/Saturn_PSRAM_Stress_LateSample-rbf.sha256
          sha256sum output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.rbf | tee .ci/Saturn_PSRAM_Stress_LongGap-rbf.sha256
          {
            echo '## Saturn PSRAM read-fix pair Quartus result'
            echo
            echo '```text'
            grep -hE 'Quartus Prime Full Compilation|Total logic elements|Total registers|Total block memory bits|Total pins|Slack|Timing requirements' \
              output_files_stress_late/Saturn_PSRAM_Stress_LateSample.flow.rpt \
              output_files_stress_late/Saturn_PSRAM_Stress_LateSample.fit.rpt \
              output_files_stress_late/Saturn_PSRAM_Stress_LateSample.sta.rpt \
              output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.flow.rpt \
              output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.fit.rpt \
              output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.sta.rpt 2>/dev/null | tail -n 160 || true
            echo
            cat .ci/Saturn_PSRAM_Stress_LateSample-rbf.sha256
            cat .ci/Saturn_PSRAM_Stress_LongGap-rbf.sha256
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload RBF and Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn_PSRAM_Stress_ReadFix-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            .ci/Saturn_PSRAM_Stress_LateSample-build.log
            .ci/Saturn_PSRAM_Stress_LateSample-rbf.sha256
            .ci/Saturn_PSRAM_Stress_LongGap-build.log
            .ci/Saturn_PSRAM_Stress_LongGap-rbf.sha256
            output_files_stress_late/Saturn_PSRAM_Stress_LateSample.rbf
            output_files_stress_late/Saturn_PSRAM_Stress_LateSample.flow.rpt
            output_files_stress_late/Saturn_PSRAM_Stress_LateSample.map.rpt
            output_files_stress_late/Saturn_PSRAM_Stress_LateSample.fit.rpt
            output_files_stress_late/Saturn_PSRAM_Stress_LateSample.sta.rpt
            output_files_stress_late/Saturn_PSRAM_Stress_LateSample.asm.rpt
            output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.rbf
            output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.flow.rpt
            output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.map.rpt
            output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.fit.rpt
            output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.sta.rpt
            output_files_stress_gap/Saturn_PSRAM_Stress_LongGap.asm.rpt
