name: Plan A SH7604 slow burst counterexample
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [codex/saturn-plan-a-bsc]
    paths:
      - .github/workflows/plan-a-bsc.yml
      - sim/psram/tb_sh7604_slow_burst.sv
      - rtl/SH/SH7604/BSC.sv
permissions:
  contents: read
jobs:
  counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Compile on Runner and record original contract failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          git show ca35b11465a7563060aac11a057914e1f70f2079:rtl/SH/SH7604/BSC.sv > .ci/BSC-original.sv
          for variant in original candidate; do
          bsc=.ci/BSC-original.sv
          if [ "$variant" = candidate ]; then bsc=rtl/SH/SH7604/BSC.sv; fi
          for slow in 0 1; do
            verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j 2 --top-module tb_sh7604_slow_burst \
              -GSLOW=$slow --Mdir .ci/obj-$variant-$slow \
              rtl/SH/SH7604/SH7604_pkg.sv "$bsc" \
              sim/psram/tb_sh7604_slow_burst.sv > .ci/compile-$variant-$slow.log 2>&1
            set +e
            .ci/obj-$variant-$slow/Vtb_sh7604_slow_burst > .ci/$variant-$slow.log 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > .ci/$variant-$slow.exitcode
            grep 'SUMMARY' .ci/$variant-$slow.log
          done
          done
          # Both positive controls must pass; configured slow SDRAM must expose a failure.
          python3 - <<'PY'
          import re
          from pathlib import Path
          fast=Path('.ci/original-0.log').read_text()
          slow=Path('.ci/original-1.log').read_text()
          assert Path('.ci/original-0.exitcode').read_text().strip()=='0'
          assert Path('.ci/original-1.exitcode').read_text().strip()!='0'
          assert 'Slow-memory burst contract violated' in slow
          assert 'SUMMARY slow=0 cases=64 failed=0' in fast
          rows=re.findall(r'CASE slow=1 dram=(\d) port=(\d) burst=(\d) fast=(\d) delay=(\d+) offset=(\d+) words=(\d+) errors=(\d+)',slow)
          assert len(rows)==192, len(rows)
          assert all(int(e)==0 for d,p,b,f,l,o,w,e in rows if d=='0'), 'Non-SDRAM control failed'
          assert any(int(e)>0 for d,p,b,f,l,o,w,e in rows if d=='1' and b=='1' and l=='12'), 'Counterexample absent'
          for slow,cases in ((0,64),(1,192)):
              assert Path(f'.ci/candidate-{slow}.exitcode').read_text().strip()=='0'
              assert f'SUMMARY slow={slow} cases={cases} failed=0' in Path(f'.ci/candidate-{slow}.log').read_text()
          before=[line for line in fast.splitlines() if line.startswith('CASE ')]
          after=[line for line in Path('.ci/candidate-0.log').read_text().splitlines() if line.startswith('CASE ')]
          assert before==after, 'Fast-path observations changed'
          print('Original counterexample reproduced; candidate 256 cases pass; fast-path observations unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SATURN_PA_BSC_COUNTEREXAMPLE
          path: .ci/*.*
          include-hidden-files: true
      - name: Verify production cache fills and hits with registered RAM models
        shell: bash
        run: |
          set -euo pipefail
          for variant in original candidate; do
          bsc=.ci/BSC-original.sv
          if [ "$variant" = candidate ]; then bsc=rtl/SH/SH7604/BSC.sv; fi
          for slow in 0 1; do
            verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j 2 --top-module tb_sh7604_cache_slow_burst \
              -GSLOW=$slow --Mdir .ci/cache-obj-$variant-$slow \
              rtl/SH/SH7604/SH7604_pkg.sv "$bsc" rtl/SH/SH7604/CACHE.sv \
              sim/psram/sh7604_cache_memory_models.sv sim/psram/tb_sh7604_cache_slow_burst.sv \
              > .ci/cache-compile-$variant-$slow.log 2>&1
            set +e
            .ci/cache-obj-$variant-$slow/Vtb_sh7604_cache_slow_burst > .ci/cache-$variant-$slow.log 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > .ci/cache-$variant-$slow.exitcode
            grep 'CACHE_SUMMARY' .ci/cache-$variant-$slow.log
          done
          done
          python3 - <<'PY'
          from pathlib import Path
          assert Path('.ci/cache-original-0.exitcode').read_text().strip()=='0'
          assert 'CACHE_SUMMARY slow=0 cases=16 failed=0' in Path('.ci/cache-original-0.log').read_text()
          old=Path('.ci/cache-original-1.log').read_text()
          assert 'CACHE_SUMMARY slow=1 cases=64 failed=0' not in old
          assert 'Cache slow burst integration failed' in old
          assert Path('.ci/cache-original-1.exitcode').read_text().strip()!='0'
          for slow,cases in ((0,16),(1,64)):
              assert Path(f'.ci/cache-candidate-{slow}.exitcode').read_text().strip()=='0'
              assert f'CACHE_SUMMARY slow={slow} cases={cases} failed=0' in Path(f'.ci/cache-candidate-{slow}.log').read_text()
          print('Production CACHE+BSC: original fails, candidate registered-RAM fills and hits pass.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SATURN_PA_CACHE_INTEGRATION
          path: .ci/cache-*.*
          include-hidden-files: true
