name: Plan A SH7604 slow burst counterexample
on:
  workflow_dispatch:
  push:
    branches: [codex/saturn-plan-a-bsc]
    paths:
      - .github/workflows/plan-a-bsc.yml
      - sim/psram/tb_sh7604_slow_burst.sv
      - rtl/SH/SH7604/BSC.sv
permissions:
  contents: read
jobs:
  counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Compile on Runner and record original contract failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          for slow in 0 1; do
            verilator --binary --timing -Wno-fatal -j 2 --top-module tb_sh7604_slow_burst \
              -GSLOW=$slow --Mdir .ci/obj-$slow \
              rtl/SH/SH7604/SH7604_pkg.sv rtl/SH/SH7604/BSC.sv \
              sim/psram/tb_sh7604_slow_burst.sv > .ci/compile-$slow.log 2>&1
            set +e
            .ci/obj-$slow/Vtb_sh7604_slow_burst > .ci/original-$slow.log 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > .ci/original-$slow.exitcode
            grep 'SUMMARY' .ci/original-$slow.log
          done
          # Both positive controls must pass; configured slow SDRAM must expose a failure.
          python3 - <<'PY'
          import re
          from pathlib import Path
          fast=Path('.ci/original-0.log').read_text()
          slow=Path('.ci/original-1.log').read_text()
          assert 'SUMMARY slow=0 cases=64 failed=0' in fast
          rows=re.findall(r'CASE slow=1 dram=(\d) port=(\d) burst=(\d) fast=(\d) delay=(\d+) offset=(\d+) words=(\d+) errors=(\d+)',slow)
          assert len(rows)==192, len(rows)
          assert all(int(e)==0 for d,p,b,f,l,o,w,e in rows if d=='0'), 'Non-SDRAM control failed'
          assert any(int(e)>0 for d,p,b,f,l,o,w,e in rows if d=='1' and b=='1' and l=='12'), 'Counterexample absent'
          print('Original fails the configured slow SDRAM burst; positive controls pass.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SATURN_PA_BSC_COUNTEREXAMPLE
          path: .ci/*.*
          include-hidden-files: true
