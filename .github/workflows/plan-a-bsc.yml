name: Plan A SH7604 slow burst counterexample
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [codex/saturn-plan-a-bsc]
    paths:
      - .github/workflows/plan-a-bsc.yml
      - sim/psram/tb_sh7604_slow_burst.sv
      - sim/psram/tb_sh7604_cache_slow_burst.sv
      - sim/psram/sh7604_cache_memory_models.sv
      - rtl/SH/SH7604/BSC.sv
      - rtl/plan_a_uart_trace.sv
      - sim/psram/tb_plan_a_uart_trace.sv
      - sim/psram/tb_plan_a_uart_paged.sv
      - sim/psram/tb_plan_a_trace_address_bank.sv
      - sim/psram/tb_plan_a_fetch_progress.sv
      - rtl/SH/SH7604/SH7604.sv
      - rtl/Saturn/DCC.sv
      - rtl/SH/core/SH_core.sv
      - sim/psram/tb_plan_a_first_fault.sv
      - sim/psram/tb_plan_a_core_fault.sv
      - sim/psram/tb_plan_a_dcc_owners.sv
permissions:
  contents: read
jobs:
  counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y verilator iverilog
      - name: Verify UART snapshots and stopped-clock recovery on Runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          python3 scripts/decode_plan_a_uart.py --self-test | tee .ci/uart-decoder.log
          for divider in 8 434; do
            verilator --binary --timing -Wno-fatal -j "$(nproc)" --top-module tb_plan_a_uart_trace \
              -GDIVIDER=$divider --Mdir .ci/uart-$divider rtl/plan_a_uart_trace.sv sim/psram/tb_plan_a_uart_trace.sv \
              > .ci/uart-compile-$divider.log 2>&1
            .ci/uart-$divider/Vtb_plan_a_uart_trace | tee -a .ci/plan-a-uart.log
          done
          for divider in 8 434; do
            verilator --binary --timing -Wno-fatal -j "$(nproc)" --top-module tb_plan_a_uart_paged \
              -GDIVIDER=$divider --Mdir .ci/uart-paged-$divider rtl/plan_a_uart_trace.sv sim/psram/tb_plan_a_uart_paged.sv \
              > .ci/uart-paged-compile-$divider.log 2>&1
            .ci/uart-paged-$divider/Vtb_plan_a_uart_paged | tee -a .ci/plan-a-uart-paged.log
          done
          for divider in 8 434; do
            verilator --binary --timing -Wno-fatal -j "$(nproc)" --top-module tb_plan_a_uart_paged \
              -GDIVIDER=$divider -GHEADER=167 --Mdir .ci/uart-arb-$divider \
              rtl/plan_a_uart_trace.sv sim/psram/tb_plan_a_uart_paged.sv \
              > .ci/uart-arb-compile-$divider.log 2>&1
            .ci/uart-arb-$divider/Vtb_plan_a_uart_paged | tee -a .ci/plan-a-uart-arb.log
          done
          for unit in trace_address_bank fetch_progress first_fault; do
            verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j "$(nproc)" --top-module tb_plan_a_$unit \
              --Mdir .ci/uart-$unit rtl/plan_a_uart_trace.sv sim/psram/tb_plan_a_$unit.sv \
              > .ci/uart-$unit-compile.log 2>&1
            .ci/uart-$unit/Vtb_plan_a_$unit | tee .ci/uart-$unit.log
          done
          verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j "$(nproc)" \
            +define+SATURN_APS6408_DEBUG_UART --top-module tb_plan_a_dcc_owners \
            --Mdir .ci/dcc-observer rtl/Saturn/DCC.sv sim/psram/tb_plan_a_dcc_owners.sv \
            > .ci/dcc-observer-compile.log 2>&1
          .ci/dcc-observer/Vtb_plan_a_dcc_owners | tee .ci/dcc-observer.log
          verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j "$(nproc)" \
            +define+SATURN_APS6408_DEBUG_UART +define+SIM --top-module tb_plan_a_core_fault \
            --Mdir .ci/core-fault rtl/SH/core/SH_pkg.sv rtl/SH/core/SH_regfile.sv \
            rtl/SH/core/SH_core.sv sim/psram/tb_plan_a_core_fault.sv \
            > .ci/core-fault-compile.log 2>&1
          .ci/core-fault/Vtb_plan_a_core_fault | tee .ci/core-fault.log
      - name: Compile on Runner and record original contract failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          git show ca35b11465a7563060aac11a057914e1f70f2079:rtl/SH/SH7604/BSC.sv > .ci/BSC-original.sv
          for variant in original candidate; do
          bsc=.ci/BSC-original.sv
          if [ "$variant" = candidate ]; then bsc=rtl/SH/SH7604/BSC.sv; fi
          for slow in 0 1; do
            verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j 2 --top-module tb_sh7604_slow_burst \
              -GSLOW=$slow --Mdir .ci/obj-$variant-$slow \
              rtl/SH/SH7604/SH7604_pkg.sv "$bsc" \
              sim/psram/tb_sh7604_slow_burst.sv > .ci/compile-$variant-$slow.log 2>&1
            set +e
            .ci/obj-$variant-$slow/Vtb_sh7604_slow_burst > .ci/$variant-$slow.log 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > .ci/$variant-$slow.exitcode
            grep 'SUMMARY' .ci/$variant-$slow.log
          done
          done
          # Both positive controls must pass; configured slow SDRAM must expose a failure.
          python3 - <<'PY'
          import re
          from pathlib import Path
          fast=Path('.ci/original-0.log').read_text()
          slow=Path('.ci/original-1.log').read_text()
          assert Path('.ci/original-0.exitcode').read_text().strip()=='0'
          assert Path('.ci/original-1.exitcode').read_text().strip()!='0'
          assert 'Slow-memory burst contract violated' in slow
          assert 'SUMMARY slow=0 cases=64 failed=0' in fast
          rows=re.findall(r'CASE slow=1 dram=(\d) port=(\d) burst=(\d) fast=(\d) delay=(\d+) offset=(\d+) words=(\d+) errors=(\d+)',slow)
          assert len(rows)==192, len(rows)
          assert all(int(e)==0 for d,p,b,f,l,o,w,e in rows if d=='0'), 'Non-SDRAM control failed'
          assert any(int(e)>0 for d,p,b,f,l,o,w,e in rows if d=='1' and b=='1' and l=='12'), 'Counterexample absent'
          for slow,cases in ((0,64),(1,192)):
              assert Path(f'.ci/candidate-{slow}.exitcode').read_text().strip()=='0'
              assert f'SUMMARY slow={slow} cases={cases} failed=0' in Path(f'.ci/candidate-{slow}.log').read_text()
          before=[line for line in fast.splitlines() if line.startswith('CASE ')]
          after=[line for line in Path('.ci/candidate-0.log').read_text().splitlines() if line.startswith('CASE ')]
          assert before==after, 'Fast-path observations changed'
          print('Original counterexample reproduced; candidate 256 cases pass; fast-path observations unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SATURN_PA_BSC_COUNTEREXAMPLE
          path: .ci/*.*
          include-hidden-files: true
      - name: Verify production cache fills and hits with actual M10K and MLAB read timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          assert 'rtl/SH7604_mem.sv' in Path('files.qip').read_text()
          mem=Path('rtl/SH7604_mem.sv').read_text()
          assert mem.count('rdaddress_reg = "UNREGISTERED"')==3
          assert mem.count('address_reg_b = "CLOCK1"')==1
          print('Actual files.qip: registered CACHE_RAM and asynchronous TAG/VALID/LRU MLAB reads.')
          PY
          for variant in original candidate; do
          bsc=.ci/BSC-original.sv
          if [ "$variant" = candidate ]; then bsc=rtl/SH/SH7604/BSC.sv; fi
          for slow in 0 1; do
            verilator --binary --timing -Wno-fatal -Wno-BLKANDNBLK -j 2 --top-module tb_sh7604_cache_slow_burst \
              -GSLOW=$slow --Mdir .ci/cache-obj-$variant-$slow \
              rtl/SH/SH7604/SH7604_pkg.sv "$bsc" rtl/SH/SH7604/CACHE.sv \
              sim/psram/sh7604_cache_memory_models.sv sim/psram/tb_sh7604_cache_slow_burst.sv \
              > .ci/cache-compile-$variant-$slow.log 2>&1
            for initial in zero stale; do
              args=''
              if [ "$initial" = stale ]; then args='+stale_init'; fi
              set +e
              .ci/cache-obj-$variant-$slow/Vtb_sh7604_cache_slow_burst $args > .ci/cache-$variant-$slow-$initial.log 2>&1
              result=$?
              set -e
              printf '%s\n' "$result" > .ci/cache-$variant-$slow-$initial.exitcode
              grep 'CACHE_SUMMARY' .ci/cache-$variant-$slow-$initial.log
            done
          done
          done
          python3 - <<'PY'
          from pathlib import Path
          for initial in ('zero','stale'):
              assert Path(f'.ci/cache-original-0-{initial}.exitcode').read_text().strip()=='0'
              assert 'CACHE_SUMMARY slow=0 cases=16 failed=0' in Path(f'.ci/cache-original-0-{initial}.log').read_text()
              old=Path(f'.ci/cache-original-1-{initial}.log').read_text()
              assert 'CACHE_SUMMARY slow=1 cases=64 failed=0' not in old
              assert 'Cache slow burst integration failed' in old
              assert Path(f'.ci/cache-original-1-{initial}.exitcode').read_text().strip()!='0'
              for slow,cases in ((0,16),(1,64)):
                  assert Path(f'.ci/cache-candidate-{slow}-{initial}.exitcode').read_text().strip()=='0'
                  assert f'CACHE_SUMMARY slow={slow} cases={cases} failed=0' in Path(f'.ci/cache-candidate-{slow}-{initial}.log').read_text()
          print('Production CACHE+BSC: original fails, candidate M10K/MLAB model fills and hits pass.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SATURN_PA_CACHE_INTEGRATION
          path: .ci/cache-*.*
          include-hidden-files: true
